<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>記帳小幫手</title>
<meta name="theme-color" content="#faf8f5" />
<meta name="description" content="簡單的手機記帳 App，記錄支出、依分類整理、查看月消費統計與美食評分" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div id="app">

  <header class="app-header" id="app-header">
    <div class="app-header-inner">
      <button class="app-back" id="app-back" hidden aria-label="返回"></button>
      <span class="app-header-title" id="app-title">記一筆</span>
    </div>
  </header>

  <!-- Home: quick add + this month's summary -->
  <section id="view-home" class="view">

    <div class="card">
      <div class="amount-input-wrap">
        <div class="amount-label">金額</div>
        <input id="home-amount" class="amount-input" type="number" inputmode="decimal" placeholder="0" min="0" step="1" />
      </div>
      <div class="card-row" style="margin-bottom:4px;">
        <button type="button" class="btn btn-ghost accent" id="home-split-toggle">與人分帳</button>
        <span id="home-split-summary" style="font-size:12px;color:var(--color-text-muted);"></span>
      </div>
      <div class="category-grid" id="home-category-grid"></div>

      <div class="rating-box" id="home-rating-box" hidden>
        <div class="rating-head">
          <span>好吃嗎？給個評分（選填）</span>
          <span class="rating-value-label" id="home-rating-label">尚未評分</span>
        </div>
        <div id="home-rating-stars"></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="home-date">日期</label>
          <input id="home-date" type="date" />
        </div>
      </div>
      <div class="field">
        <label for="home-note">備註（選填）</label>
        <input id="home-note" type="text" placeholder="店名、品項…" maxlength="60" />
      </div>
      <button id="home-save" class="btn btn-primary btn-block">儲存</button>
    </div>

    <!-- Month summary, merged onto the same screen -->
    <div class="section-title" id="home-summary-anchor">月結算</div>

    <div class="month-switcher">
      <button class="icon-btn" id="summary-prev-month" aria-label="上個月"></button>
      <div class="month-label" id="summary-month-label"></div>
      <button class="icon-btn" id="summary-next-month" aria-label="下個月"></button>
    </div>

    <div class="card" id="summary-total-card">
      <div class="card-row">
        <span style="font-size:13px;color:var(--color-text-muted);">本月總支出</span>
        <span style="font-size:13px;color:var(--color-text-muted);" id="summary-count-label"></span>
      </div>
      <div class="total-spend" id="summary-total-amount">$0</div>
      <div class="budget-row" id="summary-total-budget-row" hidden style="margin-top:12px;">
        <div class="progress-track"><div class="progress-fill" id="summary-total-progress"></div></div>
        <div class="card-row" id="summary-total-budget-label" style="margin-top:6px;font-size:13px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">分類佔比</div>
      <div class="chart-wrap"><canvas id="summary-pie"></canvas></div>
      <div class="legend-list" id="summary-legend"></div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">近 6 個月趨勢</div>
      <div class="chart-wrap trend"><canvas id="summary-trend"></canvas></div>
    </div>

    <div class="card" id="summary-budgets-card">
      <div class="section-title" style="margin-top:0">分類預算</div>
      <div id="summary-budget-list"></div>
    </div>

    <div class="section-title">最近記錄</div>
    <div id="home-recent-list"></div>
  </section>

  <!-- Records -->
  <section id="view-records" class="view" hidden>
    <div class="filter-row">
      <select id="records-month-filter"></select>
      <select id="records-category-filter"></select>
    </div>
    <div id="records-list"></div>
  </section>

  <!-- Ratings: food & drink scores -->
  <section id="view-ratings" class="view" hidden>
    <div class="card">
      <div class="stat-grid">
        <div>
          <div class="stat-value" id="ratings-count">0</div>
          <div class="stat-label">已評分</div>
        </div>
        <div>
          <div class="stat-value" id="ratings-average">–</div>
          <div class="stat-label">平均分數</div>
        </div>
        <div>
          <div class="stat-value" id="ratings-pending">0</div>
          <div class="stat-label">待評分</div>
        </div>
      </div>
    </div>

    <div id="ratings-pending-section" hidden>
      <div class="section-title">待評分</div>
      <div class="card" id="ratings-pending-list"></div>
    </div>

    <div class="section-title">評分排行</div>
    <div class="segmented" id="ratings-sort">
      <button type="button" class="selected" data-sort="rating">依評分</button>
      <button type="button" data-sort="date">依日期</button>
    </div>
    <div class="filter-row">
      <select id="ratings-category-filter"></select>
      <select id="ratings-min-filter">
        <option value="0">全部分數</option>
        <option value="5">只看 5 星</option>
        <option value="4">4 星以上</option>
        <option value="3">3 星以上</option>
      </select>
    </div>
    <div id="ratings-list"></div>
  </section>

  <!-- More: categories + settings/backup -->
  <section id="view-more" class="view" hidden>
    <div class="settings-section">
      <div class="card-row" style="margin-bottom:10px;">
        <span class="section-title" style="margin:0;">分類管理</span>
        <button class="btn btn-ghost accent" id="more-add-category">新增分類</button>
      </div>
      <div class="card" id="more-category-list"></div>
    </div>

    <div class="settings-section">
      <div class="section-title" style="margin-top:0">多人分帳</div>
      <a class="card card-row" href="#/split" id="more-split-link" style="text-decoration:none;color:inherit;"></a>
    </div>

    <div class="settings-section">
      <div class="section-title" style="margin-top:0">總預算</div>
      <div class="card">
        <div class="field" style="margin-bottom:0;">
          <label for="more-total-budget">每月總預算（0 表示不設定）</label>
          <input id="more-total-budget" type="number" inputmode="decimal" min="0" step="1" placeholder="0" />
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title" style="margin-top:0">資料備份</div>
      <div class="card">
        <p class="settings-desc">資料只存在這台裝置的瀏覽器裡，建議定期匯出備份，換手機或清除瀏覽器資料前記得先匯出。</p>
        <button class="btn btn-block" id="more-export-json" style="margin-bottom:8px;">匯出 JSON 備份</button>
        <button class="btn btn-block" id="more-export-csv" style="margin-bottom:8px;">匯出 CSV（試算表用）</button>
        <label class="btn btn-block" for="more-import-file">匯入 JSON 備份還原</label>
        <input type="file" id="more-import-file" accept="application/json" hidden />
      </div>
    </div>
  </section>

  <!-- Split overview (reached from More, no bottom tab) -->
  <section id="view-split" class="view" hidden>
    <div class="card-row" style="margin-bottom:14px;">
      <span class="section-title" style="margin:0;">誰欠誰</span>
      <button class="btn btn-ghost accent" id="split-add-person">新增同伴</button>
    </div>
    <div id="split-balance-list"></div>
  </section>

  <!-- Trips overview (bottom tab) -->
  <section id="view-trips" class="view" hidden>
    <div class="card-row" style="margin-bottom:14px;">
      <span class="section-title" style="margin:0;">我的方案</span>
      <button class="btn btn-ghost accent" id="trips-add">新增方案</button>
    </div>
    <div id="trips-container"></div>
  </section>

  <!-- One trip: packing list + who owes who (reached from the trips tab) -->
  <section id="view-trip" class="view" hidden>
    <div class="card">
      <div class="card-row">
        <span class="packing-card-name" id="trip-detail-name"></span>
        <button class="btn btn-ghost accent" id="trip-detail-edit"></button>
      </div>
      <div class="trip-dates" id="trip-detail-dates" hidden></div>
      <div class="pill-row" id="trip-detail-members"></div>
      <div class="stat-grid" style="margin-top:14px;">
        <div>
          <div class="stat-value" id="trip-stat-total">$0</div>
          <div class="stat-label">這趟總花費</div>
        </div>
        <div>
          <div class="stat-value" id="trip-stat-mine">$0</div>
          <div class="stat-label">我的份</div>
        </div>
        <div>
          <div class="stat-value" id="trip-stat-net">$0</div>
          <div class="stat-label" id="trip-stat-net-label">已結清</div>
        </div>
      </div>
    </div>

    <div class="segmented" id="trip-pane-switch">
      <button type="button" class="selected" data-pane="list">攜帶清單</button>
      <button type="button" data-pane="money">算帳</button>
    </div>

    <div id="trip-pane-list">
      <div class="card">
        <div class="progress-track"><div class="progress-fill" id="trip-progress"></div></div>
        <div class="card-row" style="margin-top:6px;font-size:13px;color:var(--color-text-muted);">
          <span id="trip-item-count"></span>
        </div>
      </div>

      <div class="quick-add-row">
        <input id="trip-new-item" type="text" placeholder="要帶什麼？打完按 Enter" maxlength="40" />
        <button class="btn btn-primary" id="trip-add-item" aria-label="新增項目"></button>
      </div>

      <div class="segmented" id="trip-group-mode">
        <button type="button" class="selected" data-group="item">依項目</button>
        <button type="button" data-group="person">依人分組</button>
      </div>

      <div id="trip-item-list"></div>

      <div class="modal-actions" style="margin-top:14px;">
        <button class="btn btn-ghost" id="trip-uncheck-all">全部取消勾選</button>
        <button class="btn btn-ghost" id="trip-clear-done">清除已勾選</button>
      </div>
    </div>

    <div id="trip-pane-money" hidden>
      <div class="card-row" style="margin-bottom:12px;">
        <span class="section-title" style="margin:0;">這趟的花費</span>
        <button class="btn btn-ghost accent" id="trip-add-expense"></button>
      </div>
      <div id="trip-money-body"></div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- Expense edit modal -->
<div class="modal-backdrop" id="expense-modal" hidden>
  <div class="modal-sheet">
    <h2>編輯記錄</h2>
    <p id="edit-split-note" class="settings-desc" hidden></p>
    <div class="field">
      <label for="edit-amount">金額</label>
      <input id="edit-amount" type="number" inputmode="decimal" min="0" step="1" />
    </div>
    <div class="field">
      <label for="edit-category">分類</label>
      <select id="edit-category"></select>
    </div>
    <div class="rating-box" id="edit-rating-box" hidden>
      <div class="rating-head">
        <span>評分</span>
        <span class="rating-value-label" id="edit-rating-label">尚未評分</span>
      </div>
      <div id="edit-rating-stars"></div>
    </div>
    <div class="field">
      <label for="edit-date">日期</label>
      <input id="edit-date" type="date" />
    </div>
    <div class="field">
      <label for="edit-note">備註</label>
      <input id="edit-note" type="text" maxlength="60" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="edit-delete">刪除</button>
      <button class="btn btn-primary" id="edit-save">儲存</button>
    </div>
    <button class="btn btn-ghost btn-block" id="edit-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- Category edit modal -->
<div class="modal-backdrop" id="category-modal" hidden>
  <div class="modal-sheet">
    <h2 id="category-modal-title">新增分類</h2>
    <div class="field">
      <label for="cat-name">名稱</label>
      <input id="cat-name" type="text" maxlength="20" />
    </div>
    <div class="field">
      <label>圖示</label>
      <div class="icon-picker" id="cat-icon-picker"></div>
    </div>
    <div class="field">
      <label>顏色</label>
      <div class="color-picker" id="cat-color-picker"></div>
    </div>
    <label class="switch-row" for="cat-ratable">
      <span>
        <span class="switch-text">食物 / 飲料分類</span>
        <span class="switch-desc">開啟後記帳時可以打星星評分</span>
      </span>
      <span class="switch"><input type="checkbox" id="cat-ratable" /><span class="track"></span></span>
    </label>
    <div class="modal-actions">
      <button class="btn btn-danger" id="cat-delete" hidden>刪除</button>
      <button class="btn btn-primary" id="cat-save">儲存</button>
    </div>
    <button class="btn btn-ghost btn-block" id="cat-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- Split configuration modal -->
<div class="modal-backdrop" id="split-modal" hidden>
  <div class="modal-sheet">
    <h2>與人分帳</h2>
    <div class="field">
      <label for="split-total">帳單總額</label>
      <input id="split-total" type="number" inputmode="decimal" min="0" step="1" />
    </div>
    <div class="field">
      <label for="split-payer">誰先付的錢</label>
      <select id="split-payer"></select>
    </div>
    <div class="field">
      <div class="card-row" style="margin-bottom:6px;">
        <label style="margin:0;">分帳對象</label>
        <button type="button" class="btn btn-ghost accent" id="split-modal-add-person">新增同伴</button>
      </div>
      <div id="split-participants"></div>
    </div>
    <div class="field">
      <label>分帳方式</label>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn method-btn selected" data-method="equal" style="flex:1;">平均分攤</button>
        <button type="button" class="btn method-btn" data-method="custom" style="flex:1;">自訂金額</button>
      </div>
    </div>
    <div class="card-row" id="split-summary" style="font-size:13px;"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="split-apply">套用</button>
    </div>
    <button class="btn btn-ghost btn-block" id="split-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- Trip add/edit modal -->
<div class="modal-backdrop" id="trip-modal" hidden>
  <div class="modal-sheet">
    <h2 id="trip-modal-title">新增方案</h2>
    <div class="field">
      <label for="trip-name">方案名稱</label>
      <input id="trip-name" type="text" maxlength="24" placeholder="沖繩 3 天 2 夜" />
    </div>
    <div class="field-row">
      <div class="field">
        <label for="trip-start">開始日期（選填）</label>
        <input id="trip-start" type="date" />
      </div>
      <div class="field">
        <label for="trip-end">結束日期（選填）</label>
        <input id="trip-end" type="date" />
      </div>
    </div>
    <div class="field">
      <div class="card-row" style="margin-bottom:6px;">
        <label style="margin:0;">同行的人</label>
        <button type="button" class="btn btn-ghost accent" id="trip-add-person">新增同伴</button>
      </div>
      <div class="chip-select" id="trip-members"></div>
      <p class="settings-desc" style="margin:6px 0 0;">你自己一定在方案裡，不用勾。</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="trip-delete" hidden>刪除</button>
      <button class="btn btn-primary" id="trip-save">儲存</button>
    </div>
    <button class="btn btn-ghost btn-block" id="trip-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- Trip expense modal -->
<div class="modal-backdrop" id="trip-expense-modal" hidden>
  <div class="modal-sheet">
    <h2 id="trip-expense-title">新增花費</h2>
    <div class="field">
      <label for="trip-expense-note">項目</label>
      <input id="trip-expense-note" type="text" maxlength="60" placeholder="晚餐、租車、住宿…" />
    </div>
    <div class="field">
      <label for="trip-expense-total">總金額</label>
      <input id="trip-expense-total" type="number" inputmode="decimal" min="0" step="1" placeholder="0" />
    </div>
    <div class="field-row">
      <div class="field">
        <label for="trip-expense-category">分類</label>
        <select id="trip-expense-category"></select>
      </div>
      <div class="field">
        <label for="trip-expense-date">日期</label>
        <input id="trip-expense-date" type="date" />
      </div>
    </div>
    <div class="field">
      <label for="trip-expense-payer">誰先付的錢</label>
      <select id="trip-expense-payer"></select>
    </div>
    <div class="field">
      <label>誰要分</label>
      <div style="display:flex;gap:8px;margin-bottom:4px;">
        <button type="button" class="btn method-btn selected" data-method="equal" style="flex:1;">平均分攤</button>
        <button type="button" class="btn method-btn" data-method="custom" style="flex:1;">自訂金額</button>
      </div>
      <div id="trip-expense-participants"></div>
    </div>
    <div class="card-row" id="trip-expense-summary" style="font-size:13px;"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="trip-expense-delete" hidden>刪除</button>
      <button class="btn btn-primary" id="trip-expense-save">儲存</button>
    </div>
    <button class="btn btn-ghost btn-block" id="trip-expense-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- Trip settle-up modal -->
<div class="modal-backdrop" id="trip-settle-modal" hidden>
  <div class="modal-sheet">
    <h2>登記結清</h2>
    <div class="field-row">
      <div class="field">
        <label for="trip-settle-from">誰付錢</label>
        <select id="trip-settle-from"></select>
      </div>
      <div class="field">
        <label for="trip-settle-to">付給誰</label>
        <select id="trip-settle-to"></select>
      </div>
    </div>
    <div class="field">
      <label for="trip-settle-amount">金額</label>
      <input id="trip-settle-amount" type="number" inputmode="decimal" min="0" step="1" />
    </div>
    <div class="field">
      <label for="trip-settle-date">日期</label>
      <input id="trip-settle-date" type="date" />
    </div>
    <div class="field">
      <label for="trip-settle-note">備註（選填）</label>
      <input id="trip-settle-note" type="text" maxlength="60" placeholder="現金、轉帳…" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="trip-settle-save">儲存</button>
    </div>
    <button class="btn btn-ghost btn-block" id="trip-settle-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- Packing item edit modal -->
<div class="modal-backdrop" id="packing-item-modal" hidden>
  <div class="modal-sheet">
    <h2>編輯項目</h2>
    <div class="field">
      <label for="packing-item-name">名稱</label>
      <input id="packing-item-name" type="text" maxlength="40" />
    </div>
    <div class="field">
      <div class="card-row" style="margin-bottom:6px;">
        <label for="packing-item-person" style="margin:0;">誰帶</label>
        <button type="button" class="btn btn-ghost accent" id="packing-item-add-person">管理成員</button>
      </div>
      <select id="packing-item-person"></select>
    </div>
    <div class="field">
      <label for="packing-item-note">備註（選填）</label>
      <input id="packing-item-note" type="text" maxlength="40" placeholder="數量、放在哪…" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="packing-item-delete">刪除</button>
      <button class="btn btn-primary" id="packing-item-save">儲存</button>
    </div>
    <button class="btn btn-ghost btn-block" id="packing-item-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- Person add/edit modal -->
<div class="modal-backdrop" id="person-modal" hidden>
  <div class="modal-sheet">
    <h2 id="person-modal-title">新增同伴</h2>
    <div class="field">
      <label for="person-name">名字</label>
      <input id="person-name" type="text" maxlength="20" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="person-delete" hidden>刪除</button>
      <button class="btn btn-primary" id="person-save">儲存</button>
    </div>
    <button class="btn btn-ghost btn-block" id="person-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<!-- Settle up modal -->
<div class="modal-backdrop" id="settle-modal" hidden>
  <div class="modal-sheet">
    <h2 id="settle-modal-title">登記結清</h2>
    <div class="field">
      <label for="settle-amount">金額</label>
      <input id="settle-amount" type="number" inputmode="decimal" min="0" step="1" />
    </div>
    <div class="field">
      <label for="settle-direction">方向</label>
      <select id="settle-direction">
        <option value="receive">對方還我錢</option>
        <option value="pay">我還對方錢</option>
      </select>
    </div>
    <div class="field">
      <label for="settle-date">日期</label>
      <input id="settle-date" type="date" />
    </div>
    <div class="field">
      <label for="settle-note">備註（選填）</label>
      <input id="settle-note" type="text" maxlength="60" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="settle-save">儲存</button>
    </div>
    <button class="btn btn-ghost btn-block" id="settle-cancel" style="margin-top:8px;">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/vendor/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
